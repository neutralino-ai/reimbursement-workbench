# Standalone API ingress. Does not include the disabled website configuration.
user www-data;
worker_processes auto;
pid /run/reimbursement-api/nginx.pid;
error_log /var/log/reimbursement-api/error.log warn;
events { worker_connections 1024; }
http {
    default_type application/json;
    server_tokens off;
    log_format api_security escape=json '{"time":"$time_iso8601","remote":"$remote_addr","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/reimbursement-api/access.log api_security;
    client_body_temp_path /run/reimbursement-api/client-body;
    proxy_temp_path /run/reimbursement-api/proxy;
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=api_connections:10m;
    server {
        listen 29375 ssl;
        listen [::]:29375 ssl;
        server_name coop.neutrinophysics.cn;
        if ($http_host != "coop.neutrinophysics.cn:29375") { return 421; }
        if ($ssl_server_name != coop.neutrinophysics.cn) { return 421; }
        ssl_certificate /etc/letsencrypt/live/coop.neutrinophysics.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coop.neutrinophysics.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:api_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        client_max_body_size 30m;
        client_body_timeout 60s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        send_timeout 60s;
        limit_conn api_connections 30;
        limit_conn_status 429;
        limit_req_status 429;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        location ^~ /reimbursement/api/ {
            limit_req zone=api_requests burst=60 nodelay;
            # No URI suffix: preserve /reimbursement, and keep the port in Host.
            proxy_pass http://127.0.0.1:29376;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_max_temp_file_size 0;
        }
        # No static files or unrelated services are exposed on this port.
        location / { return 404; }
    }
}
