name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: mac-arm64
            args: --mac --arm64
            extension: zip
          - runner: macos-15-intel
            target: mac-x64
            args: --mac
            extension: zip
          - runner: windows-2022
            target: win-x64
            args: --win
            extension: exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reimbursement-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Require the tag to match the package version
        run: node -e 'if ("v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/package-desktop.mjs ${{ matrix.args }}
      - run: node scripts/verify-desktop-package.mjs ${{ matrix.args }}
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: find ../output/desktop -name Reimbursement.app -maxdepth 4 -exec codesign --verify --deep --strict {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: output/desktop/*/Reimbursement-*-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified assets with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum Reimbursement-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" Reimbursement-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Reimbursement Workbench $GITHUB_REF_NAME" --notes-file "../docs/releases/$GITHUB_REF_NAME.md" --latest
